<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Atlas OAuth Callback</title>
<style>
  body{background:#0b0d10;color:#e8e6df;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:24px;}
  .card{max-width:640px;width:100%;background:#15181c;border:1px solid #23272c;border-radius:12px;padding:32px;}
  h1{font-size:20px;margin:0 0 8px;}
  p.sub{color:#8a8f98;margin:0 0 24px;font-size:14px;}
  .field{margin-bottom:20px;}
  .label{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#8a8f98;margin-bottom:6px;}
  .value{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#0b0d10;border:1px solid #23272c;border-radius:8px;padding:12px;word-break:break-all;font-size:14px;}
  button{background:#d9a441;color:#1a1300;border:none;border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;margin-top:8px;}
  .error{color:#e0665c;}
  .ok{color:#8fd19e;font-size:13px;margin-top:4px;}
</style>
</head>
<body>
  <div class="card">
    <h1 id="title">Atlas OAuth Callback</h1>
    <p class="sub" id="sub">Copy the code below and paste it back into your terminal.</p>
    <div id="content"></div>
  </div>
<script>
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  const state = params.get('state');
  const error = params.get('error');
  const content = document.getElementById('content');
  function field(label, value, id){
    const div = document.createElement('div');
    div.className = 'field';
    div.innerHTML = '<div class="label">'+label+'</div><div class="value" id="'+id+'">'+ (value || '(none)') +'</div>' +
      (value ? '<button data-copy="'+id+'">Copy</button><div class="ok" id="'+id+'-ok" style="display:none;">Copied</div>' : '');
    return div;
  }
  if (error) {
    document.getElementById('title').textContent = 'Authorization failed';
    document.getElementById('title').className = 'error';
    document.getElementById('sub').textContent = 'TikTok returned an error.';
    content.appendChild(field('Error', error, 'err'));
  } else if (code) {
    content.appendChild(field('Authorization code', code, 'code'));
    content.appendChild(field('State', state, 'state'));
  } else {
    document.getElementById('sub').textContent = 'No code or error found in the URL.';
  }
  content.addEventListener('click', function(e){
    const btn = e.target.closest('button[data-copy]');
    if (!btn) return;
    const id = btn.getAttribute('data-copy');
    const text = document.getElementById(id).textContent;
    navigator.clipboard.writeText(text).then(function(){
      const ok = document.getElementById(id+'-ok');
      if (ok) { ok.style.display = 'block'; setTimeout(()=>ok.style.display='none', 1500); }
    }).catch(function(){});
  });
</script>
</body>
</html>
